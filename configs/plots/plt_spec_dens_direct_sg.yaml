# ─── Spectral Density Plot ───────────────────────────────────────────────────
# Plots J_αβ(ω) from pre-computed HDF5 data.
# See mqed/plotting/plot_spectral_density.py for details.

defaults:
  - hydra: default
  - _self_

hydra:
  job:
    name: plot_spectral_density

# --- Input ---
# Path to the spectral density HDF5 file produced by
# mqed.analysis.spectral_density. This single-file key is kept for backward
# compatibility. For comparison plots, use the optional curves list below.
# input_file: "${oc.env:MQED_ROOT,./data}/example/spec_dens_data/spec_dens_10D_10D_Emin_0.10_Emax_6.00_359pts_height_1nm.hdf5"

# Optional multi-file comparison mode. Uncomment and edit to overlay spectral
# density curves from multiple HDF5 files, e.g. direct vs singularity_aware vs
# pole_aware_hybrid_dcim.
#
# Style precedence for multi-file plots:
#   1. Per-selected-curve styles in each file entry: separation_styles or
#      compact lists such as separation_linestyles / separation_markers.
#   2. File-level defaults in that entry: color, linestyle, lw, marker, alpha.
#   3. Global plot_settings.separation_colors / separation_linestyles.
#
# curves: []
curves:
  - label: "Direct"
    path: "${oc.env:MQED_ROOT,./data}/example/spec_dens_data/spec_dens_1D_1D_Emin_0.10_Emax_6.00_419pts_height_300nm.hdf5"
    color: "tab:blue"       # file-level default: all Direct curves are blue
    lw: 2.0
    separation_styles:       # order follows plot_settings.separation_indices
      - {color: "tab:blue", linestyle: "-"}
      - {linestyle: "--"}
      - {linestyle: "-."}
  - label: "Singularity-aware"
    path: "${oc.env:MQED_ROOT,./data}/example/spec_dens_data/spec_dens_1D_1D_Emin_0.10_Emax_6.00_419pts_height_300nm_sg_aware.hdf5"
    color: "tab:orange"
    lw: 2.0
    separation_styles:
      - {linestyle: "--"}
      - {linestyle: "-."}
      - {linestyle: ":"}
# For pair-layout HDF5 files, use pair_styles / pair_linestyles / pair_markers.

# --- Font settings (following plot_pr.py conventions) ---
font:
  family: "Arial"
  labelsize: 18
  ticksize: 16
  legendsize: 14
  titlesize: 18
  labelweight: "bold"
  titleweight: "bold"

# --- Plot settings ---
plot_settings:
  # For separation-indexed layout: which Rx indices to plot (0-based)
  # Example: [0, 3] overlays the curves for Rx index 0 and Rx index 3.
  separation_indices: [0,1,2]
  separation_values_nm: [0,12,120]
  separation_value_tolerance_nm: 1.0e-9
  separation_multipliers: [1.0,1.0,100]

  # For pair-indexed layout: which (α, β) pairs to plot
  # Each entry is [alpha, beta].  [0, 0] = self-term of emitter 0.
  # Example: [[0, 0], [0, 3]] overlays both pair-resolved curves.
  pair_indices:
    - [0, 0]
    - [0, 3]
  pair_separation_values_nm: []
  pair_reference_index: 0
  pair_separation_tolerance_nm: 1.0e-6
  pair_multipliers: [1.0,1.0]

  spectral_density_unit: "eV"

  # Labels
  # For separation layout, {Rx} is replaced by the Rx value in nm
  label_template: "Rx = {Rx:.1f} nm"
  pair_label_template: "R = {distance_nm:.1f} nm"
  xlabel: "Energy (eV)"
  ylabel: null
  title: "Spectral Density $J(\\omega)$"

  # Axis scales: "linear" or "log"
  xscale: "linear"
  yscale: "linear"
  y_sci:
    enabled: false
    style: "sci"
    scilimits: [0, 0]
    use_math_text: false
    offset_text_size: 20
    offset_text_weight: "bold"

  # Optional axis limits (null = auto)
  x_range_eV: [0,6]
  y_range: null

  # Style
  figsize: [8, 6]
  lw: 1.5
  dpi: 300
  grid: true

  # Output
  save_plot: true
  filename: "Spec_dens_Yiting_sg_aware.png"
