defaults:
  - hydra: default
  - _self_

hydra:
  job:
    name: Dyadic_GF_NLayer

materials:
  air:
    source_type: constant
    constant_value: 1.0+0.0j
  dielectric_spacer:
    source_type: constant
    constant_value: 2.25+0.0j
  Ag_drude:
    source_type: Drude
    drude_config:
      eps_inf: 5.3
      omega_p_eV: 9.5
      gamma_eV: 0.2

stack:
  source_layer: 2
  layers:
    - name: bottom_air
      material: air
      thickness_m: null
    - name: lower_silver_film
      material: Ag_drude
      thickness_nm: 100.0
    - name: emitter_spacer
      material: air
      thickness_nm: 600.0
    - name: upper_silver_film
      material: Ag_drude
      thickness_nm: 100.0
    - name: top_air
      material: air
      thickness_m: null

simulation:
  spectral_param: energy_eV
  energy_eV:
    segments:
      - min: 0.1
        max: 2.0
        points: 19
      - min: 2.01
        max: 6.0
        points: 400
  wavelength_nm:
    min: 620.0
    max: 620.0
    points: 1
  position:
    zD_nm: 300.0
    zA_nm: 300.0
    Rx_nm:
      start: 0.0
      stop: 12
      points: 13
  integration:
    # Available N-layer integration methods and practical guidance:
    #   direct
    #     Pros: plain real-axis quad_vec reference; simplest and least modeled.
    #     Cons: can miss narrow pole/branch-adjacent features unless q sampling
    #       and adaptive subdivision happen to resolve them. Good baseline only.
    #   singularity_aware
    #     Pros: recommended robust benchmark for this plasmonic five-layer stack;
    #       still direct Bessel-form quadrature, but split at branch points and
    #       near-real pole projections. Best first choice for Rx=0 Purcell/LDOS.
    #     Cons: slower than DCIM; explicit pole/branch terms are diagnostic only.
    #   hybrid_dcim
    #     Pros: useful near-field accelerator; direct low-q part plus fitted
    #       high-q evanescent tail. Often more relevant than branch-cut DCIM for
    #       small Rx dominated by high-k evanescent/plasmonic coupling.
    #     Cons: tail fit can fail near sharp poles/branch features; keep validation
    #       and fallback enabled when using metal stacks. At Rx=0 this solver
    #       automatically routes to singularity_aware.
    #   pole_subtracted_direct
    #     Pros: Stage-1 Bessel-form pole subtraction. Detected simple-pole
    #       residues are subtracted from the real-axis kernels and numerically
    #       added back over the same Bessel convention, avoiding double counting.
    #     Cons: not an analytic pole add-back yet; use as a validated diagnostic
    #       against singularity_aware before trusting production sweeps.
    #   pole_aware_hybrid_dcim
    #     Pros: Stage-2 method. Fits only the pole-subtracted smooth high-q tail
    #       with hybrid DCIM, then compares the full result to singularity_aware.
    #       This is the method to test next against singularity_aware for Rx>0.
    #     Cons: experimental until benchmarked; rejected fits fall back to
    #       singularity_aware when fallback is enabled. At Rx=0 it also
    #       automatically routes to singularity_aware.
    #   branch_cut_dcim
    #     Pros: future/intermediate-far-field research path based on outgoing
    #       Hankel branch contours; most relevant for larger lateral distances.
    #     Cons: not derived as a fully consistent replacement for the current
    #       half-line Bessel integrals; currently diagnostic/experimental only.
    #       At Rx=0 this solver automatically routes to singularity_aware.
    #   fixed_grid
    #     Pros: reproducible q-grid diagnostic for checking quadrature behavior.
    #     Cons: not adaptive; can be inefficient or inaccurate near singularities.
    #   dcim
    #     Pros: legacy whole-domain exponential fit.
    #     Cons: least robust here; prefer hybrid_dcim or pole_aware_hybrid_dcim.
    #
    # This verified literature-reproduction config keeps direct quadrature as the
    # default. For new validation jobs, first run singularity_aware, then compare
    # candidate accelerated methods with identical energies/Rx/stack settings.
    # Example CLI overrides:
    #   simulation.integration.method=singularity_aware
    #   simulation.integration.method=hybrid_dcim
    #   simulation.integration.method=pole_subtracted_direct
    #   simulation.integration.method=pole_aware_hybrid_dcim
    #   simulation.integration.method=branch_cut_dcim
    method: direct
    qmax: null
    epsabs: 1.0e-10
    epsrel: 1.0e-10
    limit: 400
    split_propagating: false

    # DCIM q-window controls.  Prefer the *_factor entries for new configs:
    # they are dimensionless multipliers of |k0| = omega/c, so values like
    # dcim_q_stop_factor: 10.0 mean q_stop = 10 |k0| at each frequency.
    # The older absolute-SI entries dcim_q_start/dcim_q_stop and
    # hybrid_*_q_stop remain supported for backward compatibility; if a factor
    # is provided, it takes precedence over the absolute value.
    dcim_q_start: 0.0
    dcim_q_stop: 2.0e8
    dcim_q_start_factor: 0.0
    dcim_q_stop_factor: 20.0
    dcim_sample_count: 128
    dcim_image_count: 16
    hybrid_direct_q_stop: 6.0e7
    hybrid_tail_q_stop: 2.0e8
    hybrid_direct_q_stop_factor: 6.0
    hybrid_tail_q_stop_factor: 20.0
    hybrid_sample_count: 160
    hybrid_image_count: 18
    hybrid_validation_rtol: 5.0e-2
    hybrid_validate_tail: true
    hybrid_fallback_to_direct: true
    fixed_grid_points: 2048

    # Singularity-aware direct quadrature options.
    # The Sommerfeld integration variable is the transverse wave number q [1/m].
    # All pole_search_*_factor values below are dimensionless multipliers of
    # |k0| = omega / c [1/m], so the complex pole-search box is
    #   Re(q) / |k0| in [real_min_factor, real_max_factor]
    #   Im(q) / |k0| in [imag_min_factor, imag_max_factor]
    # For plasmonic metal stacks, poles can move into the high-k evanescent
    # region q/|k0| >> 1. Increase pole_search_real_max_factor, e.g. 10-20,
    # when validating near-field, guided-mode, or strongly confined plasmonic
    # behavior. Use broader/deeper searches only as diagnostics because they
    # are slower and may reveal heavily damped poles with little observable
    # contribution.
    # The solver detects Airy-denominator poles in the complex q plane and
    # splits the real-axis Sommerfeld quadrature at branch points and near-real
    # pole projections. Explicit pole/branch-cut contributions remain
    # diagnostic; they are not automatically added to the Green tensor.
    pole_search_real_min_factor: 0.0
    pole_search_real_max_factor: 6.0
    pole_search_imag_min_factor: -2.0
    pole_search_imag_max_factor: 1.0e-3
    pole_search_max_depth: 10
    pole_search_contour_points: 24
    pole_search_residual_tol: 1.0e-6
    pole_search_branch_guard_factor: 1.0e-4
    pole_residue_radius_factor: 1.0e-4
    pole_residue_points: 96

    # Branch-cut diagnostics and experimental branch-cut DCIM options.
    # Use branch_cut_dcim as an opt-in experimental method only after comparing
    # against singularity_aware for this stack/frequency range. When validation
    # fails, branch_cut_dcim falls back to singularity_aware by default.
    branch_cut_t_limit_factor: 8.0
    branch_cut_side_offset_factor: 1.0e-6
    branch_cut_layers: auto
    branch_cut_sample_count: 128
    branch_cut_image_count: 16
    branch_cut_validation_rtol: 5.0e-2
    branch_cut_validate: true
    branch_cut_fallback_to_singularity_aware: true
    branch_cut_include_poles: true
    branch_cut_prefactor: "1.0+0.0j"
    branch_cut_jump_sign: 1.0
    branch_cut_use_hankel: true

    # Stage-1/2 Bessel-form pole subtraction options.
    # pole_subtracted_direct subtracts detected simple-pole residues from the
    # real-axis Bessel kernels and numerically adds that same pole model back to
    # avoid double counting. pole_aware_hybrid_dcim fits only the pole-subtracted
    # smooth high-q tail, then validates against singularity_aware.
    pole_subtraction_validate: true
    pole_subtraction_validation_rtol: 5.0e-2
    pole_subtraction_validation_atol: 1.0e-12
    pole_subtraction_fallback_to_singularity_aware: true
    pole_subtraction_include_poles: true
    pole_subtraction_residue_method: contour

parallel:
  backend: sequential
  n_jobs: -1
  mpi_nproc: 4
  mpi_auto_launch: true
  mpi_exec: mpiexec

output:
  prefix: "NLayer_GF_five_layer_Ag_spacer"
