# Mie Green tensor example for the ring geometry in
# Varguet et al., J. Chem. Phys. 154, 084303 (2021), Fig. 1.
#
# Geometry:
#   - silver sphere radius R = 8 nm in air/vacuum
#   - N_e orthoradial emitters in the equatorial xy plane
#   - emitter-surface gap h = 2 nm, so emitter radius is R + h = 10 nm
#   - dipole moment magnitude d = 24 D
#
# The generated ring uses angles phi_j = phase_offset_deg + 360*j/N_e and local
# azimuthal unit vectors e_phi = [-sin(phi_j), cos(phi_j), 0]. Nearest-neighbor
# chord distances at 10 nm radius: N=1 -> 0 nm, N=15 -> 4.158 nm,
# N=50 -> 1.256 nm. Example override: simulation.emitter_ring.emitter_count=50

defaults:
  - hydra: default
  - _self_

hydra:
  job:
    name: GF_sphere_example

simulation:
  spectral_param: energy_eV
  energy_eV:
    min: 2.6
    max: 3.2
    points: 121
  nmax: 20
  strict_regions: true

  geometry:
    boundary: sphere
    radius_nm: 8.0

  sphere_example:
    reference: "Varguet et al., J. Chem. Phys. 154, 084303 (2021), Fig. 1"
    dipole_moment_debye: 24.0

  emitter_ring:
    emitter_count: 15
    sphere_radius_nm: ${simulation.geometry.radius_nm}
    emitter_surface_gap_nm: 2.0
    # emitter_radius_nm: 10.0  # Optional alternative; must match radius + gap if both are set.
    z_nm: 0.0
    phase_offset_deg: 0.0
    orientation: orthoradial

materials:
  regions:
    - n: 1.0
      name: vacuum exterior
    - type: drude
      eps_inf: 6.0
      # Paper value: omega_p = 1.20e16 rad/s = 7.898543 eV.
      omega_p_eV: 7.8985434828
      # Paper value: Gamma_p = 7.74e13 rad/s = 0.0509456 eV.
      gamma_eV: 0.0509456045
      name: silver sphere

parallel:
  backend: sequential
  n_jobs: -1
  mpi_nproc: 4
  mpi_auto_launch: false
  mpi_exec: mpiexec

output:
  # Relative to this config file for direct --config runs; Hydra replaces this
  # with its runtime output directory. This keeps direct output under repo/outputs.
  directory: ../../outputs
  prefix: mie_silver_sphere_ring
  layout: pair
