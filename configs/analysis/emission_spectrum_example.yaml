defaults:
  - hydra: default
  - _self_

hydra:
  job:
    name: emission_spectrum_example

# Default output name from GF_sphere_example.yaml with N=15. For N=50, override
# input_file with the generated ..._emitters_50pts.hdf5 path.
input_file: "${oc.env:MQED_ROOT,./outputs}/mie_silver_sphere_ring_Emin_2.60_Emax_3.20_121pts_emitters_15pts.hdf5"
output_prefix: "sphere_emission_example"

# Varguet effective-model approximation: scattered diagonal plus only the real
# vacuum contribution off diagonal. Use `structure` for sphere-only studies.
green_component: varguet_effective
shift_method: real_green
mu_debye: 24.0
gamma0_eV: 0.05
normalize: true
transition_energy_eV: null
bright_weights: null

transition_energy_grid_eV:
  min: 2.6
  max: 3.2
  points: 61

# The sphere pair file stores the generated out-of-plane orientations. Omitting
# an orientation override here lets this example follow any emitter count from
# GF_sphere_example.yaml, including N=15 and the N=50 Hydra override.
