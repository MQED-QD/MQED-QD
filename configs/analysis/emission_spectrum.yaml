defaults:
  - hydra: default
  - _self_

hydra:
  job:
    name: emission_spectrum

# Default output name from GF_sphere_example.yaml with N=15. Override input_file
# when using another count, for example the corresponding ..._emitters_50pts.hdf5.
input_file: "${oc.env:MQED_ROOT,./outputs}/mie_silver_sphere_ring_Emin_2.60_Emax_3.20_121pts_emitters_15pts.hdf5"
output_prefix: "emission_spectrum"

# Paper Fig. 2 convention: scattered Green tensor on the diagonal, plus the
# real vacuum Green tensor off diagonal. The free-space imaginary coupling is
# neglected and gamma0_eV supplies the phenomenological free-space linewidth.
green_component: varguet_effective
shift_method: real_green
mu_debye: 24.0
gamma0_eV: 0.05
normalize: true
transition_energy_eV: null
bright_weights: null

transition_energy_grid_eV:
  min: 2.6
  max: 3.2
  points: 61

# Pair-layout Mie files generated from simulation.emitter_ring store the matching
# per-emitter orientations. They are used automatically when this section is
# omitted, so the same analysis config works for arbitrary N (for example 15 or
# 50). Add orientations.emitter_orientations or theta_deg/phi_deg only to
# intentionally override the stored geometry.
